#!name=极核 ZEEHO · Shadowrocket 版
#!desc=极核ZEEHO多账号签到 + 网页面板（Shadowrocket 适配版）。浏览器访问 http://zeeho.box 打开面板；打开极核App自动捕获 Token/appId；每日 07:00 定时签到。需安装并信任 Shadowrocket CA 证书并开启 MITM。仅供个人学习使用，请勿用于违规用途。
#!author=lucky
#!homepage=https://github.com/mlink798/ZEEHO
#!icon=https://cdn.jsdelivr.net/gh/mlink798/ZEEHO@main/script/ZEEHO.png
#!date=2026-09-24

# ========== 使用说明 ==========
# 1) 将本 .conf 与同目录两个脚本文件（zeeho.js / zeeho_box_enhanced.js）一并导入
#    Shadowrocket（配置文件 + 脚本文件需位于应用本地目录）。
#    若使用远程脚本，可将 script-path 替换为对应的 GitHub Raw 地址。
# 2) Shadowrocket → 设置 → 证书 → 安装并信任 CA；
#    设置 → MITM → 打开开关并确认 hostname 已包含下方 [MITM] 列表。
# 3) 打开极核App「我的」页面 → 自动捕获 Token；
#    浏览器访问 http://zeeho.box → 打开面板配置账号。

[Host]
# 面板虚拟域名占位解析：实际响应由 http-request 脚本拦截并直接返回，
# 请求不会真正发往 127.0.0.1
zeeho.box = 127.0.0.1

[Script]
# ================ 极核 ZEEHO ================
# 面板入口（http://zeeho.box）+ 极核API自动捕获 appId
# 脚本内部分流：zeeho.box → 返回面板HTML；zeehoev.com → 捕获 appId 后放行
http-request ^https?:\/\/(zeeho\.box|.*zeehoev\.com)\/.* script-path=zeeho_box_enhanced.js, requires-body=true, timeout=60, tag=极核面板

# 极核Token自动捕获（打开极核App → 我的页面，读取 /setting 响应体）
http-response ^https?:\/\/tapi\.zeehoev\.com\/v1\.0\/mine\/cfmotoservermine\/setting script-path=zeeho.js, requires-body=true, timeout=60, tag=极核抓Token

# 极核每日签到（每天 07:00，可自行修改时间）
cron "0 7 * * *" script-path=zeeho.js, tag=极核每日签到

[MITM]
hostname = tapi.zeehoev.com, h5.zeehoev.com, zeeho.box
